*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Poppins',sans-serif}
#game{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:1;background:#020205}

/* ===== TOUCH RIPPLE EFFECT (2s Duration) =====</i> */
.touch-sparkle{
  position:fixed;width:45px;height:45px;border-radius:50%;
  border:2px solid #ff0055;background:radial-gradient(circle,rgba(255,0,85,0.6) 0%,transparent 70%);
  transform:translate(-50%,-50%) scale(0.2);pointer-events:none;z-index:999999;
  animation:touchAnim 2s cubic-bezier(0.1,1,0.3,1) forwards;
}
@keyframes touchAnim{
  0%{transform:translate(-50%,-50%) scale(0.2);opacity:1;box-shadow:0 0 10px #ff0055;}
  50%{opacity:0.8;box-shadow:0 0 30px #ffcc00,0 0 50px #ff0055;}
  100%{transform:translate(-50%,-50%) scale(3.5);opacity:0;border-color:transparent;}
}

/* ===== LAUNCHER BUTTON ===== */
#launcher{
  position:fixed;top:70px;right:12px;z-index:99990;
  width:60px;height:60px;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,#ff3366,#ff0033 50%,#440011);
  border:3px solid #ffcc00;
  box-shadow:0 0 30px rgba(255,0,85,.9),0 0 15px rgba(255,204,0,.7);
  display:flex;align-items:center;justify-content:center;
  animation:pulseLaunch 1.6s ease-in-out infinite;
  user-select:none;
}
#launcher img{width:34px;height:34px;border-radius:50%;object-fit:cover;box-shadow:0 0 10px #fff;}
@keyframes pulseLaunch{
  0%,100%{transform:scale(1);box-shadow:0 0 25px rgba(255,0,85,.8)}
  50%{transform:scale(1.1);box-shadow:0 0 45px rgba(255,204,0,1)}
}

/* ===== PASSWORD MODAL ===== */
#passModal{

  background:rgba(2,2,5,0.85);backdrop-filter:blur(12px);

}

.pass-sub{font-size:10px;color:#ff99bb;letter-spacing:2px;margin:6px 0 14px;font-family:'Poppins',sans-serif;font-weight:700;}
.pass-inp{

  background:#0a0206;color:#fff;text-align:center;font-size:16px;font-weight:700;
  outline:none;margin-bottom:12px;font-family:'Orbitron',monospace;letter-spacing:3px;
  box-shadow:inset 0 0 12px rgba(255,0,85,.4);
}
.pass-btn{
  width:100%;height:44px;border:none;border-radius:14px;cursor:pointer;

  color:#fff;font-weight:900;font-size:13px;letter-spacing:2px;font-family:'Orbitron',monospace;

.pass-err{color:#ff4466;font-size:11px;margin-top:10px;display:none;font-weight:700}
.pass-x{
  position:absolute;top:12px;right:16px;background:none;border:none;color:#ff6688;

/* ===== MAIN CLUSTER (REALISTIC DRAGON FIRE THEME) ===== */
#cluster{

  display:none;align-items:center;justify-content:center;
  user-select:none;touch-action:none;filter:drop-shadow(0 0 25px rgba(255,0,85,0.7));
}

/* REALISTIC DRAGON FIRE WINGS */
.wing{
  width:95px;height:190px;position:relative;pointer-events:none;z-index:2;
  filter:drop-shadow(0 0 20px rgba(255,0,85,1)) drop-shadow(0 0 40px rgba(255,165,0,0.8));
}
.wing svg{width:100%;height:100%;overflow:visible}
.wing-l .layer{transform-origin:92% 50%}
.wing-r .layer{transform-origin:8% 50%}
.wing-l .l1{animation:dragonFlL1 .55s ease-in-out infinite}
.wing-l .l2{animation:dragonFlL2 .55s ease-in-out infinite .03s}
.wing-l .l3{animation:dragonFlL3 .55s ease-in-out infinite .06s}
.wing-l .l4{animation:dragonFlL2 .55s ease-in-out infinite .09s}
.wing-r .l1{animation:dragonFlR1 .55s ease-in-out infinite}
.wing-r .l2{animation:dragonFlR2 .55s ease-in-out infinite .03s}
.wing-r .l3{animation:dragonFlR3 .55s ease-in-out infinite .06s}

(function () {

  var unlocked = false;

  /* Touch Ripple Effect Everywhere on Document (2s Duration) */
  document.addEventListener('pointerdown', function(e) {
    var spark = document.createElement('div');
    spark.className = 'touch-sparkle';
    spark.style.left = e.clientX + 'px';
    spark.style.top = e.clientY + 'px';

  launcher.onclick = function () {
    if (unlocked) {
      cluster.style.display = 'flex';
      launcher.style.display = 'none';
      return;
    }
    passModal.style.display = 'flex';
    setTimeout(function () { passIn.focus(); }, 100);
  };

  document.getElementById('passClose').onclick = function () {
    passModal.style.display = 'none';
    passIn.value = '';
    loginErr.style.display = 'none';
  };

  function unlock() {
    if (passIn.value === PASS) {
      unlocked = true;
      passModal.style.display = 'none';
      launcher.style.display = 'none';
      cluster.style.display = 'flex';

      loginErr.style.display = 'block';
      passIn.value = '';
      passIn.focus();

  document.getElementById('unlockBtn').onclick = unlock;
  passIn.addEventListener('keydown', function (e) { if (e.key === 'Enter') unlock(); });

  /* Drag function */
  var handle = document.getElementById('dragHandle');
  var dragging = false, sx, sy, ol, ot;
  function ds(e) {
    dragging = true;
    var p = e.touches ? e.touches[0] : e;
    sx = p.clientX; sy = p.clientY;
    var r = cluster.getBoundingClientRect();
    ol = r.left; ot = r.top;
    if (e.cancelable) e.preventDefault();
  }
  function dm(e) {
    if (!dragging) return;
    var p = e.touches ? e.touches[0] : e;
    cluster.style.left = (ol + p.clientX - sx) + 'px';
    cluster.style.top = (ot + p.clientY - sy) + 'px';
    cluster.style.right = 'auto';
    if (e.cancelable) e.preventDefault();
  }
  function de() { dragging = false; }
  handle.addEventListener('mousedown', ds);
  handle.addEventListener('touchstart', ds, { passive: false });
  document.addEventListener('mousemove', dm);
  document.addEventListener('touchmove', dm, { passive: false });
  document.addEventListener('mouseup', de);
  document.addEventListener('touchend', de);

  document.getElementById('closeBtn').onclick = function () {
    cluster.style.display = 'none';
    launcher.style.display = 'flex';
  };
  document.getElementById('nextBtn').onclick = function () { apply(getInfo(), true); };

  function hash(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }
  function getInfo() {
    var now = new Date();
    var y = now.getUTCFullYear();
    var m = String(now.getUTCMonth() + 1).padStart(2, '0');
    var d = String(now.getUTCDate()).padStart(2, '0');
    var total = now.getUTCHours() * 3600 + now.getUTCMinutes() * 60 + now.getUTCSeconds();
    var idx = Math.floor(total / 30) + 1;
    var left = 30 - (total % 30);
    if (left === 0) left = 30;
    return {
      id: '' + y + m + d + '1000' + String(idx).padStart(4, '0'),
      short: String(idx).padStart(4, '0'),
      left: left
    };
  }
  function predict(id) {
    var h = hash('BG_SIAM_ULTIMATE_DRAGON' + id);
    var num = h % 10;
    return { num: num, size: num >= 5 ? 'BIG' : 'SMALL', sync: 98 + (h % 2), ping: 5 + (h % 8) };
  }

  var last = '';
  function apply(info, force) {
    if (!force && info.id === last) return;
    last = info.id;
    var r = predict(info.id);
    document.getElementById('ballNum').textContent = r.num;
    document.getElementById('periodVal').textContent = info.short;
    document.getElementById('modeSide').textContent = r.size;
    document.getElementById('syncPct').textContent = r.sync + '%';
    document.getElementById('syncFill').style.width = r.sync + '%';
    document.getElementById('pingVal').textContent = r.ping + 'MS';
    document.getElementById('sysVal').textContent = 'ACTIVE';
    document.getElementById('lockTxt').textContent = '▣ DRAGON FIRE LOCKED';
    var b = document.getElementById('sigBadge');
    b.innerHTML = '<img src="21632.jpg" alt="Logo"> ' + r.size;
    b.className = 'badge ' + r.size;
  }
  function tick() {
    var info = getInfo();
    document.getElementById('timerVal').textContent = info.left;
    var b = document.getElementById('sigBadge');
    if (info.left <= 5) {
      b.innerHTML = '<img src="21632.jpg" alt="Logo"> WAIT';
      b.className = 'badge WAIT';
      document.getElementById('lockTxt').textContent = '▣ SCANNING FIRE...';
    }
    if (info.id !== last) apply(info, false);
  }
})();
</script>
</body>
</html>
